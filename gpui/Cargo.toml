[package]
name = "dotsmith"
version = "1.4.0"
description = "Dotsmith: pixel-art sprite generator for Windows (GPUI interface + Rust diffusion engine)"
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gpui = "0.2.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
unicode-segmentation = "1.12"
anyhow = "1"
raw-window-handle = "0.6"
dotsmith-engine = { path = "../engine" }
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"

[build-dependencies]
embed-resource = "3.0.12"
