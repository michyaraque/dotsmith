name: Feature request
description: Suggest a new mode, tool or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task or the asset you need, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Reference sprites, mock-ups or other tools that do it well.
