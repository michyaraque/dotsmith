name: Set up the Dotsmith toolchain
description: Rust (from rust-toolchain.toml) with sccache and a per-job target cache, CUDA from NVIDIA's redistributable archives, and the MSVC / Windows SDK tool paths.

inputs:
  cache-key:
    description: Name of this job's target cache (jobs that compile differently keep separate caches)
    required: true
  save-cache:
    description: Save the target cache at the end of the job (only master should, so other branches do not evict it)
    default: "false"
  cuda:
    description: CUDA release to build against (its redistributable archives, with their licenses)
    default: "13.1.1"

runs:
  using: composite
  steps:
    - name: Install Rust
      shell: pwsh
      run: rustup toolchain install

    # every rustc call is cached on its own, so a changed lockfile or another workflow reuses whatever matches
    - uses: mozilla-actions/sccache-action@v0.0.9

    - name: Route rustc through sccache
      shell: pwsh
      run: |
        "RUSTC_WRAPPER=sccache" >> $env:GITHUB_ENV
        "SCCACHE_GHA_ENABLED=true" >> $env:GITHUB_ENV

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ inputs.save-cache }}

    - name: Restore CUDA ${{ inputs.cuda }}
      id: cuda-cache
      uses: actions/cache@v4
      with:
        path: C:\cuda\${{ inputs.cuda }}
        key: cuda-redist-${{ inputs.cuda }}-v1

    # only the components the build compiles and ships with, unpacked into one tree (each archive carries the license)
    - name: Install CUDA ${{ inputs.cuda }}
      if: steps.cuda-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $base = 'https://developer.download.nvidia.com/compute/cuda/redist'
        $manifest = Invoke-RestMethod "$base/redistrib_${{ inputs.cuda }}.json"
        $dest = 'C:\cuda\${{ inputs.cuda }}'
        $tmp = "$env:RUNNER_TEMP\cuda-redist"
        New-Item -ItemType Directory -Force $dest, $tmp | Out-Null
        foreach ($name in 'cuda_nvcc', 'cuda_cudart', 'libcublas', 'libcurand', 'cuda_nvrtc', 'cuda_cccl', 'cuda_crt', 'libnvvm') {
          $part = $manifest.$name.'windows-x86_64'
          if (-not $part) { continue }
          $zip = Join-Path $tmp (Split-Path $part.relative_path -Leaf)
          Invoke-WebRequest "$base/$($part.relative_path)" -OutFile $zip
          Expand-Archive $zip -DestinationPath $tmp -Force
          Copy-Item (Join-Path $tmp ([IO.Path]::GetFileNameWithoutExtension($zip)) '*') $dest -Recurse -Force
          Remove-Item $zip
        }

    - name: Point the build at CUDA, MSVC and the Windows SDK
      shell: pwsh
      run: |
        $cuda = 'C:\cuda\${{ inputs.cuda }}'
        if (-not (Test-Path "$cuda\bin\nvcc.exe")) { throw 'CUDA ${{ inputs.cuda }} is missing' }
        "CUDA_PATH=$cuda" >> $env:GITHUB_ENV
        "$cuda\bin" >> $env:GITHUB_PATH
        "$cuda\bin\x64" >> $env:GITHUB_PATH
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
        $msvc = Get-ChildItem "$vs\VC\Tools\MSVC" | Sort-Object Name -Descending | Select-Object -First 1
        $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" | Sort-Object FullName -Descending | Select-Object -First 1
        "NVCC_CCBIN=$($msvc.FullName)\bin\Hostx64\x64\cl.exe" >> $env:GITHUB_ENV
        # CUDA 12's `nvcc --lib` looks for the MSVC tools on the PATH rather than through NVCC_CCBIN
        "$($msvc.FullName)\bin\Hostx64\x64" >> $env:GITHUB_PATH
        "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
