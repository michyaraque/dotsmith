name: CI

on:
  push:
    branches: [master]
    paths-ignore: &docs
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/screenshots/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/dependabot.yml'
  pull_request:
    paths-ignore: *docs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  format:
    name: Format
    # Linux minutes cost half of Windows ones and formatting needs no toolchain beyond rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  # clippy and the tests compile differently (check vs release), so they run side by side, each with its own cache
  lint:
    name: Clippy
    needs: format
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
        with:
          cache-key: clippy
          save-cache: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Tests
    needs: format
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      # release, like the packaged app: the dependencies it compiles are the ones the release workflow finds in sccache
      - uses: ./.github/actions/setup-toolchain
        with:
          cache-key: release
          save-cache: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo test --workspace --release --locked
