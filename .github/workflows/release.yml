name: Release

# The version is the one in gpui/Cargo.toml: bump it there (with its CHANGELOG.md section) to publish a new release.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' gpui/Cargo.toml | head -1)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already published: no new version."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  # the standard package for RTX 30 and newer, and the legacy one for older cards (Krea 2 with f32 activations)
  build:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          - package: standard
            cuda: 13.1.1
            compute: "80"
            suffix: ""
          - package: legacy
            cuda: 12.4.1
            compute: "61"
            suffix: -legacy
    env:
      CUDA_COMPUTE_CAP: ${{ matrix.compute }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-toolchain
        with:
          cache-key: release-${{ matrix.package }}
          cuda: ${{ matrix.cuda }}

      - name: Compile candle's kernels for cards before compute 7.0
        if: matrix.package == 'legacy'
        shell: pwsh
        run: |
          $shim = "$env:GITHUB_WORKSPACE/engine/cuda/pascal.cuh" -replace '\\', '/'
          "NVCC_APPEND_FLAGS=--pre-include $shim" >> $env:GITHUB_ENV

      - name: Package
        shell: pwsh
        run: ./gpui/scripts/package.ps1 -Suffix '${{ matrix.suffix }}'

      - uses: actions/upload-artifact@v4
        with:
          name: dotsmith-${{ matrix.package }}
          path: dist/Dotsmith-*

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and release notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          version="${TAG#v}"
          (cd dist && sha256sum Dotsmith-* > SHA256SUMS.txt)
          # this version's CHANGELOG section ("## [x.y.z]" up to the next "## "), then what to download
          section=$(awk -v v="## [$version]" 'index($0, v) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md | sed '/./,$!d')
          [ -n "$section" ] || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          {
            printf '%s\n\n' "$section"
            echo '### Download'
            echo "- **Dotsmith-$version-setup.exe** or **Dotsmith-$version-win64.zip**: for NVIDIA RTX 30 series and newer."
            echo "- **Dotsmith-$version-legacy-setup.exe** or **Dotsmith-$version-legacy-win64.zip**: for older NVIDIA cards (GTX 10 and 16, RTX 20) with Krea 2 and LiliPixel V1."
            echo '- **SHA256SUMS.txt**: checksums of every file.'
            echo
            echo 'The zips are portable: unzip all of the folder, dotsmith.exe needs the CUDA files next to it. The CUDA runtime is included; the models download from the start screen.'
          } > dist/NOTES.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release create "$TAG" dist/Dotsmith-* dist/SHA256SUMS.txt --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Dotsmith $TAG" --notes-file dist/NOTES.md --generate-notes
