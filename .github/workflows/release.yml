name: Release

# The version is the one in gpui/Cargo.toml: bump it there (with its CHANGELOG.md section) to publish a new release.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' gpui/Cargo.toml | head -1)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already published: no new version."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-toolchain
        with:
          cache-key: release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Package
        shell: pwsh
        run: ./gpui/scripts/package.ps1

      - name: Checksums and release notes
        shell: pwsh
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          Get-ChildItem dist -File -Filter 'Dotsmith-*' | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt
          # this version's CHANGELOG section ("## [x.y.z]" up to the next "## "), then what to download
          $version = $env:TAG.TrimStart('v')
          $section = (Get-Content CHANGELOG.md -Raw) -split "(?m)^## " | Where-Object { $_ -match "^\[$([regex]::Escape($version))\]" } | Select-Object -First 1
          if (-not $section) { throw "CHANGELOG.md has no section for $version" }
          $notes = ($section -replace '^\[[^\]]+\][^\r\n]*\r?\n', '').Trim()
          $download = @(
            '### Download',
            "- **Dotsmith-$version-setup.exe**: installer for Windows 10 and 11 (64-bit).",
            "- **Dotsmith-$version-win64.zip**: portable folder. Unzip all of it: dotsmith.exe needs the CUDA files next to it.",
            '- **SHA256SUMS.txt**: checksums of both.',
            '',
            'Needs an NVIDIA RTX 30 series or newer with 6 GB of VRAM or more and a current driver. The CUDA runtime is included; the models download from the start screen.'
          ) -join "`n"
          "$notes`n`n$download`n" | Set-Content dist/NOTES.md

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          $files = @(Get-ChildItem dist -File -Filter 'Dotsmith-*' | ForEach-Object FullName) + 'dist/SHA256SUMS.txt'
          gh release create $env:TAG @files --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Dotsmith $env:TAG" --notes-file dist/NOTES.md --generate-notes
